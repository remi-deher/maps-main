name: GpsMockCompanion

options:
  bundleIdPrefix: com.remi2.gpsmock
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    # AltStore re-signs the .ipa on-device with the user's own (free) Apple
    # ID at install time — CI deliberately produces an unsigned build.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
    # CI runs on Apple Silicon (arm64) runners; building/linking an x86_64
    # simulator slice nobody runs just to have `xcodebuild test` fail there
    # (the app module never gets fully built for it) is pure overhead.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  GpsMockCompanion:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          GPS-Mock Companion lit votre position réelle pour la transmettre au
          moteur GPS-Mock (vérification anti-dérive), sans jamais la partager
          ailleurs.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          GPS-Mock Companion lit votre position réelle pour la transmettre au
          moteur GPS-Mock (vérification anti-dérive), sans jamais la partager
          ailleurs.
        NSLocalNetworkUsageDescription: >-
          GPS-Mock Companion recherche le moteur GPS-Mock sur votre réseau
          local (Bonjour) pour s'y connecter automatiquement.
        NSCameraUsageDescription: >-
          GPS-Mock Companion utilise l'appareil photo pour scanner le QR Code
          affiché par l'app desktop et s'y connecter, sans enregistrer ni
          envoyer aucune image.
        NSBonjourServices:
          - _gpsmock._tcp
        NSSupportsLiveActivities: true
        # Cible du tap sur la Live Activity / l'île dynamique
        # (Widgets/SimulationActivityWidget.swift -> widgetURL), traitée par
        # ContentView.onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLName: com.remi2.gpsmock.companion
            CFBundleURLSchemes:
              - gpsmock
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.remi2.gpsmock.companion.keepalive
    settings:
      base:
        PRODUCT_NAME: GpsMockCompanion
        PRODUCT_BUNDLE_IDENTIFIER: com.remi2.gpsmock.companion
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Sans ce réglage, l'AccentColor du catalogue est compilé mais n'est pas
        # désigné comme teinte globale : tous les `Color.accentColor` de l'app
        # retombaient sur le bleu système au lieu de l'indigo défini dans
        # Assets.xcassets. Les templates Xcode le posent, XcodeGen non.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Extract Swift string literals into Localizable.xcstrings at build,
        # so the app has a real String Catalog (source = fr) ready for
        # translations instead of hard-coded strings (§3.10 baseline).
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          # GpsMockCompanionTests does `@testable import GpsMockCompanion`,
          # which requires the app module to be built with testability
          # enabled. Xcode's project templates default this on for Debug;
          # XcodeGen doesn't, so it has to be set explicitly here.
          SWIFT_ENABLE_TESTABILITY: "YES"
    dependencies:
      - target: GpsMockWidgets
        embed: true

  GpsMockWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
      - path: Sources/SimulationActivityAttributes.swift
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: GpsMockWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.remi2.gpsmock.companion.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Widgets/Assets.xcassets reprend l'AccentColor de l'app : la cible
        # widget n'embarque pas le catalogue de l'app, et `Color.accentColor`
        # y retombait sur le bleu système (audit P1-7).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GpsMockCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_NAME: GpsMockCompanionTests
        # Host the tests in the app: lets the linker defer resolving
        # GpsMockCompanion's symbols to the running app process instead of
        # requiring them at static-link time (XcodeGen's automatic wiring
        # from the dependency below wasn't taking effect).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GpsMockCompanion.app/GpsMockCompanion"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: GpsMockCompanion

schemes:
  GpsMockCompanion:
    build:
      targets:
        GpsMockCompanion: all
        GpsMockWidgets: all
        GpsMockCompanionTests: [test]
    test:
      targets:
        - GpsMockCompanionTests

