name: Tauri UI CI

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-ui-ci.yml'
  pull_request:
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-ui-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Test (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tauri-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:run

      - name: Verify build bundle
        run: npm run build
