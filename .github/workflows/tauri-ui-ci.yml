name: Tauri UI CI

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-ui-ci.yml'
  pull_request:
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-ui-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Build & Test (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tauri-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Lint check (ESLint)
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Verify build bundle
        run: npm run build
