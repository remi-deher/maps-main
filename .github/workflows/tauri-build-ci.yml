name: Tauri App Build CI

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-build-ci.yml'
      - 'engine/**'
  pull_request:
    paths:
      - 'tauri-app/**'
      - '.github/workflows/tauri-build-ci.yml'
      - 'engine/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-tauri:
    name: Build & Compile Tauri App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go (for sidecar compilation)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Install frontend dependencies
        run: |
          cd tauri-app
          npm ci

      - name: Build Go sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Rust Clippy Check
        run: |
          cargo clippy --manifest-path tauri-app/src-tauri/Cargo.toml -- -D warnings

      - name: Build Tauri App (Compilation Check)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          args: --no-bundle
