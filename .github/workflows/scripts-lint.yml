name: Scripts Lint

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-lint.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-lint.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=error scripts/linux/*.sh

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
