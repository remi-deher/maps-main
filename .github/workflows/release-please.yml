name: release-please

on:
  push:
    branches:
      - main
      - v3-rewrite

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@85e4da83921ca4d60c239d554a9d702d7657064d # v4.1.3
        with:
          release-type: node
          path: tauri-app
