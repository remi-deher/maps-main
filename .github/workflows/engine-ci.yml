name: Engine CI

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'engine/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/engine-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: engine
          args: --timeout=5m

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test (race)
        run: go test -race ./...

      - name: coverage threshold
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Current baseline is ~47% after raising coverage on cluster, server,
          # and the goios/pmd3 drivers — set a few points under it so this
          # catches a regression without blocking on every small dip.
          MIN_COVERAGE: '42'
        run: |
          go test -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -n1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}% (minimum: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 < m+0) }' || {
            echo "::error::coverage ${total}% is below the ${MIN_COVERAGE}% minimum"
            exit 1
          }

  metrics-smoke:
    name: smoke test /metrics against promtool
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Build headless engine
        run: go build -o /tmp/gpsmock-engine ./cmd/headless

      - name: Install promtool
        run: |
          curl -fsSL -o /tmp/prometheus.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.12.0/prometheus-3.12.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo mv /tmp/prometheus-3.12.0.linux-amd64/promtool /usr/local/bin/promtool

      - name: Start engine (no tunnel, cluster off — no device needed)
        run: |
          GPSMOCK_NO_TUNNEL=1 GPSMOCK_CLUSTER_MODE=off /tmp/gpsmock-engine -addr :8089 &
          echo $! > /tmp/engine.pid

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8089/api/health > /dev/null; then exit 0; fi
            sleep 0.5
          done
          echo "::error::engine did not become healthy within 15s"
          exit 1

      - name: Validate /metrics is well-formed Prometheus exposition format
        run: curl -fsS http://localhost:8089/metrics | promtool check metrics

      - name: Stop engine
        if: always()
        run: kill "$(cat /tmp/engine.pid)" 2>/dev/null || true

  docker:
    name: validate docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker Image (Default)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: gpsmock-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
