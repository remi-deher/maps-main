name: Engine CI

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'engine/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/engine-ci.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/engine-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: coverage threshold
        if: runner.os == 'Linux'
        shell: bash
        env:
          # Current baseline is ~16.7% — set just under it so this catches a
          # regression, not so high it blocks merges before coverage is built up.
          MIN_COVERAGE: '15'
        run: |
          go test -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -n1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}% (minimum: ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 < m+0) }' || {
            echo "::error::coverage ${total}% is below the ${MIN_COVERAGE}% minimum"
            exit 1
          }

  docker:
    name: validate docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Default)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: gpsmock-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

