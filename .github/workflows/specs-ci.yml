name: Specs CI

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'spec/**'
      - 'redocly.yaml'
      - '.github/workflows/specs-ci.yml'
      # Protocol type declarations in each implementation — so the conformance
      # job runs when a client adds/renames a message type, not just on spec edits.
      - 'engine/internal/api/messages.go'
      - 'ios-app/Sources/EngineClient.swift'
      - 'tauri-app/src/context/websocket.tsx'
  pull_request:
    paths:
      - 'spec/**'
      - '.github/workflows/specs-ci.yml'
      - 'engine/internal/api/messages.go'
      - 'ios-app/Sources/EngineClient.swift'
      - 'tauri-app/src/context/websocket.tsx'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Validate OpenAPI (Redocly)
        run: npx --yes @redocly/cli@latest lint spec/openapi.yaml

      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@latest validate spec/asyncapi.yaml

  conformance:
    name: protocol conformance (spec ↔ implementations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check spec matches engine / iOS / tauri message types
        run: python3 spec/check_conformance.py
