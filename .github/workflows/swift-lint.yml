name: Swift Lint

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'ios-app/**'
      - '.swiftlint.yml'
      - '.github/workflows/swift-lint.yml'
  pull_request:
    paths:
      - 'ios-app/**'
      - '.swiftlint.yml'
      - '.github/workflows/swift-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Run SwiftLint
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/realm/swiftlint:latest swiftlint lint --strict --reporter github-actions-logging
