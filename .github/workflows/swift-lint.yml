name: Swift Lint

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'ios-app/**'
      - '.swiftlint.yml'
      - '.github/workflows/swift-lint.yml'
  pull_request:
    paths:
      - 'ios-app/**'
      - '.swiftlint.yml'
      - '.github/workflows/swift-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run SwiftLint
        run: docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/realm/swiftlint:latest lint ios-app/Sources ios-app/Widgets --strict --reporter github-actions-logging
