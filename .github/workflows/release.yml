name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-engine:
    name: build engine ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod

      - name: Build
        working-directory: engine
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          out="gpsmock-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "../dist/${out}" ./cmd/headless

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-engine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  bundle-windows-engine:
    name: bundle Windows engine with both iOS drivers
    needs: build-engine
    runs-on: windows-latest
    steps:
      # checkout BEFORE download-artifact: actions/checkout cleans the workspace
      # by default, which would wipe the downloaded bundle/ if done after.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gpsmock-engine-windows-amd64
          path: bundle

      # go-ios driver: a single static binary, no runtime deps. Bundling it as
      # resources/ios.exe (the name platform.ResolveGoIos looks for first) makes
      # the go-ios driver work with zero setup — the lightweight, Python-free
      # alternative to pymobiledevice. Same version as docker/Dockerfile.
      - name: Build and bundle go-ios driver
        shell: pwsh
        run: |
          $env:GOBIN = "$pwd\bundle\resources"
          go install github.com/danielpaulus/go-ios@v1.2.0
          Rename-Item "$env:GOBIN\go-ios.exe" ios.exe

      # The pymobiledevice driver shells out to `python -m pymobiledevice3`
      # (engine/internal/platform/binary.go). Most users on Windows don't have
      # Python on PATH at all, and even those who do rarely have the module
      # installed — see the "No module named pymobiledevice3" report this
      # bundle exists to avoid. python.org's embeddable distribution lets us
      # ship a private interpreter with pymobiledevice3 pre-installed, with no
      # system Python and no installer required from the user.
      - name: Download Python embeddable distribution
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile pyembed.zip
          Expand-Archive -Path pyembed.zip -DestinationPath bundle/resources/python-embed

      - name: Enable site-packages and install pip
        shell: pwsh
        working-directory: bundle/resources/python-embed
        run: |
          (Get-Content python312._pth) -replace '#import site', 'import site' | Set-Content python312._pth
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          ./python.exe get-pip.py --no-warn-script-location

      - name: Install pymobiledevice3
        shell: pwsh
        working-directory: bundle/resources/python-embed
        run: |
          # setuptools/wheel first: the embeddable distribution ships without
          # them, and at least one transitive dep falls back to a from-source
          # build on some platforms/Python versions even when a wheel exists
          # for this one (verified locally: sslpsk-pmd3 has a win_amd64 wheel,
          # no compiler needed here — unlike linux/arm64 in docker/Dockerfile).
          ./python.exe -m pip install --no-cache-dir --upgrade setuptools wheel
          ./python.exe -m pip install --no-cache-dir pymobiledevice3
          Remove-Item get-pip.py

      - name: Zip portable bundle
        shell: pwsh
        working-directory: bundle
        run: Compress-Archive -Path * -DestinationPath ../gpsmock-engine-windows-amd64-portable.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-engine-windows-amd64-portable
          path: gpsmock-engine-windows-amd64-portable.zip

  build-tauri:
    name: build desktop app (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential libssl-dev libayatana-appindicator3-dev

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Build Go sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Build Tauri app (bundled)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-desktop-${{ matrix.platform }}
          path: |
            tauri-app/src-tauri/target/release/bundle/**/*.exe
            tauri-app/src-tauri/target/release/bundle/**/*.msi
            tauri-app/src-tauri/target/release/bundle/**/*.dmg
            tauri-app/src-tauri/target/release/bundle/**/*.AppImage
            tauri-app/src-tauri/target/release/bundle/**/*.deb
            tauri-app/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

  build-ios:
    name: build unsigned .ipa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Select latest stable Xcode (need the iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project GpsMockCompanion.xcodeproj \
            -scheme GpsMockCompanion \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/GpsMockCompanion.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p dist
          # AltStore re-signs on install; this .ipa is intentionally unsigned.
          zip -r "dist/GpsMockCompanion-unsigned.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GpsMockCompanion-unsigned-ipa
          path: ios-app/dist/GpsMockCompanion-unsigned.ipa

  docker:
    name: build & push engine image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Surfaced as an env var so steps below can gate on its presence: when the
      # DOCKERHUB_USERNAME secret isn't configured, the Docker Hub login is
      # skipped and the docker.io image line resolves to empty — so the release
      # still succeeds (pushing to ghcr.io only) instead of failing.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Don't upload the build-record (.dockerbuild) artifact: the release job's
      # download-artifact pulls *all* artifacts and chokes on it ("not a valid
      # zip file"), which fails the publish step even though every build passed.
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          # Push to ghcr.io always; add the Docker Hub image only when the
          # secret is set (empty lines are ignored by metadata-action).
          images: |
            ghcr.io/${{ github.repository }}/gpsmock-engine
            ${{ env.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/gpsmock-engine', env.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: publish GitHub release
    needs: [build-engine, bundle-windows-engine, build-tauri, build-ios, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/**/*
          generate_release_notes: true
