name: Release

# Manual gate: a release only happens when a commit pushed to main has
# "(release) vX.Y.Z" somewhere in its message — the version is whatever you
# write there, e.g. "(release) v0.6.0: New feature". No release-please, no
# drafts, no silent auto-bump — check-trigger reads that exact version,
# every job below builds it, and the final `release` job only tags +
# publishes (with all assets attached) once every single one of them has
# succeeded. A normal push with no such marker just no-ops (every job is
# skipped). workflow_dispatch (no commit message to read) falls back to
# auto-bumping the latest vX.Y.Z tag's patch number.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-trigger:
    name: check release trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Decide whether to release and compute the version
        id: check
        env:
          # Routed through env (GitHub's recommended pattern for untrusted
          # input) rather than interpolated into the script body, so nothing
          # in the commit message can break out of the string.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          shopt -s nocasematch

          version=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_release=true
          elif [[ "$COMMIT_MSG" =~ \(release\)[[:space:]]*v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            should_release=true
            version="${BASH_REMATCH[1]}"
          else
            should_release=false
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

          if [ "$should_release" != "true" ]; then
            echo "No '(release) vX.Y.Z' marker found, skipping."
            exit 0
          fi

          if [ -z "$version" ]; then
            # workflow_dispatch: no commit message to read a version from,
            # so fall back to auto-bumping the latest tag's patch number.
            last_tag="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            if [ -z "$last_tag" ]; then
              version="0.1.0"
            else
              ver="${last_tag#v}"
              major="${ver%%.*}"
              rest="${ver#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              version="${major}.${minor}.$((patch + 1))"
            fi
            echo "workflow_dispatch with no explicit version: auto-bumped from ${last_tag:-none} to v$version"
          else
            echo "Explicit version from commit message: v$version"
          fi

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists — pick a version that hasn't been released yet."
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Build the web UI once and share it; every engine build embeds it (-tags
  # webui) so each shipped engine serves the browser UI at / (headless+web).
  build-webui:
    name: build web UI
    needs: check-trigger
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
      - name: Build frontend
        working-directory: tauri-app
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webui-dist
          path: tauri-app/dist
          if-no-files-found: error

  build-engine:
    name: build engine ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [check-trigger, build-webui]
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui-dist
          path: engine/internal/webui/embedded

      - name: Build
        working-directory: engine
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          out="gpsmock-engine-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          ver="${{ needs.check-trigger.outputs.version }}"
          go build -tags webui -trimpath \
            -ldflags="-s -w -X github.com/remi-deher/maps-main/engine/internal/build.Version=${ver}" \
            -o "../dist/${out}" ./cmd/headless

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-engine-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  portable-windows-engine:
    name: build self-contained Windows portable .exe
    needs: [check-trigger, build-webui]
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod

      # Assemble both drivers, zip them, and place the zip where go:embed
      # expects it (internal/platform/embedded/drivers.zip) for the tagged build.
      - name: Assemble embedded driver payload
        shell: pwsh
        run: |
          ./scripts/bundle-drivers.ps1 -TargetDir "$pwd/drivers" -IncludePython
          New-Item -ItemType Directory -Force -Path engine/internal/platform/embedded | Out-Null
          Compress-Archive -Path drivers/* -DestinationPath engine/internal/platform/embedded/drivers.zip -Force

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui-dist
          path: engine/internal/webui/embedded

      - name: Build portable engine (drivers + web UI embedded)
        shell: pwsh
        working-directory: engine
        run: |
          $ver = "${{ needs.check-trigger.outputs.version }}"
          $ldflags = "-s -w -X github.com/remi-deher/maps-main/engine/internal/platform.driversVersion=$ver -X github.com/remi-deher/maps-main/engine/internal/build.Version=$ver"
          $env:CGO_ENABLED = "0"
          go build -tags "embed_drivers webui" -trimpath -ldflags="$ldflags" -o ../gpsmock-engine-portable.exe ./cmd/headless
          if ($LASTEXITCODE -ne 0) { throw "go build (portable) failed" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-engine-windows-amd64-portable
          path: gpsmock-engine-portable.exe
          if-no-files-found: error

  installer-windows-engine:
    name: build Windows installer (Inno Setup)
    needs: [check-trigger, portable-windows-engine]
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gpsmock-engine-windows-amd64-portable

      - name: Compile installer
        shell: pwsh
        run: |
          $ver = "${{ needs.check-trigger.outputs.version }}"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$ver" "/DPortableExe=$pwd\gpsmock-engine-portable.exe" "/O$pwd\setup-out" installer\windows\gpsmock.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-engine-windows-amd64-setup
          path: setup-out/gpsmock-engine-setup.exe
          if-no-files-found: error

  # Publish SHA-256 checksums of the per-platform engine binaries so the
  # desktop app's component self-updater (tauri-app updater.rs) can verify a
  # downloaded engine before swapping it in.
  checksums:
    name: compute engine checksums
    needs: [check-trigger, build-engine]
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: engines
          pattern: gpsmock-engine-*
          merge-multiple: true
      - name: Compute SHA-256 of engine binaries
        run: |
          cd engines
          sha256sum \
            gpsmock-engine-linux-amd64 \
            gpsmock-engine-linux-arm64 \
            gpsmock-engine-darwin-amd64 \
            gpsmock-engine-darwin-arm64 \
            gpsmock-engine-windows-amd64.exe > ../checksums.txt
          cat ../checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-checksums
          path: checksums.txt
          if-no-files-found: error

  build-tauri:
    name: build desktop app (${{ matrix.platform }})
    needs: check-trigger
    if: needs.check-trigger.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf build-essential libssl-dev libayatana-appindicator3-dev

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Set app version from the computed release version
        shell: pwsh
        run: |
          # The bundled installers read their version from tauri.conf.json,
          # which is otherwise pinned at 0.0.x regardless of the release.
          $ver = "${{ needs.check-trigger.outputs.version }}"
          $conf = "tauri-app/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = $ver
          $json | ConvertTo-Json -Depth 100 | Set-Content $conf -Encoding utf8
          Write-Host "tauri.conf.json version set to $ver"

      - name: Build Go sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1

      - name: Build Tauri app (bundled)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gpsmock-desktop-${{ matrix.platform }}
          path: |
            tauri-app/src-tauri/target/release/bundle/**/*.exe
            tauri-app/src-tauri/target/release/bundle/**/*.msi
            tauri-app/src-tauri/target/release/bundle/**/*.dmg
            tauri-app/src-tauri/target/release/bundle/**/*.AppImage
            tauri-app/src-tauri/target/release/bundle/**/*.deb
            tauri-app/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

  build-ios:
    name: build unsigned .ipa
    needs: check-trigger
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check for changes in ios-app
        id: check-changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for previous tag..."
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          echo "Previous tag found: '$PREV_TAG'"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Rebuild is required."
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$PREV_TAG" HEAD -- ios-app/; then
            echo "No changes in ios-app/ since $PREV_TAG."
            echo "Attempting to download GpsMockCompanion-unsigned.ipa from release $PREV_TAG..."
            mkdir -p dist
            if gh release download "$PREV_TAG" --pattern "GpsMockCompanion-unsigned.ipa" --dir dist; then
              echo "Successfully downloaded previous ipa release asset."
              echo "reused=true" >> "$GITHUB_OUTPUT"
            else
              echo "Failed to download release asset from $PREV_TAG. Falling back to build."
              echo "reused=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Changes detected in ios-app/ since $PREV_TAG. Rebuild is required."
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select latest stable Xcode (need the iOS 26 SDK)
        if: steps.check-changes.outputs.reused != 'true'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Cache XcodeGen
        if: steps.check-changes.outputs.reused != 'true'
        id: cache-xcodegen
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-xcodegen-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcodegen-

      - name: Install XcodeGen
        if: steps.check-changes.outputs.reused != 'true' && steps.cache-xcodegen.outputs.cache-hit != 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check-changes.outputs.reused != 'true'
        run: xcodegen generate

      - name: Build (unsigned)
        if: steps.check-changes.outputs.reused != 'true'
        run: |
          xcodebuild build \
            -project GpsMockCompanion.xcodeproj \
            -scheme GpsMockCompanion \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .ipa
        if: steps.check-changes.outputs.reused != 'true'
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/GpsMockCompanion.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p dist
          # AltStore re-signs on install; this .ipa is intentionally unsigned.
          zip -r "dist/GpsMockCompanion-unsigned.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: GpsMockCompanion-unsigned-ipa
          path: ios-app/dist/GpsMockCompanion-unsigned.ipa

  docker:
    name: build & push engine image
    needs: check-trigger
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Surfaced as an env var so steps below can gate on its presence: when the
      # DOCKERHUB_USERNAME secret isn't configured, the Docker Hub login is
      # skipped and the docker.io image line resolves to empty — so the release
      # still succeeds (pushing to ghcr.io only) instead of failing.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Don't upload the build-record (.dockerbuild) artifact: the release job's
      # download-artifact pulls *all* artifacts and chokes on it ("not a valid
      # zip file"), which fails the publish step even though every build passed.
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Log in BEFORE setting up QEMU: setup-qemu-action pulls
      # tonistiigi/binfmt from Docker Hub, and an anonymous pull is subject to
      # Docker Hub rate limits (the "unknown" Head error that flaked this job
      # twice). Authenticating first makes that pull authenticated.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          # Push to ghcr.io always; add the Docker Hub image only when the
          # secret is set (empty lines are ignored by metadata-action).
          images: |
            ghcr.io/${{ github.repository }}/gpsmock-engine
            ${{ env.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/gpsmock-engine', env.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=${{ needs.check-trigger.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-enroller:
    name: build ios-enroller (GUI & CLI)
    needs: check-trigger
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: engine/go.mod

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios-enroller/package-lock.json

      # 1. Build GUI (ios-enroller standalone exe)
      - name: Build GUI Enroller
        shell: pwsh
        run: |
          cd ios-enroller
          npm ci
          npx pkg . --output dist/ios-enroller.exe

      # 2. Build CLI (ios-enroller-cli Go binary)
      - name: Build CLI Enroller
        shell: pwsh
        run: |
          cd ios-enroller-cli
          go build -ldflags="-s -w" -o dist/ios-enroller-cli.exe .

      # 3. Copy binaries to a common staging area and upload
      - name: Stage enroller artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item ios-enroller/dist/ios-enroller.exe -Destination staging/
          Copy-Item ios-enroller-cli/dist/ios-enroller-cli.exe -Destination staging/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-enroller-binaries
          path: staging/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [check-trigger, build-engine, checksums, portable-windows-engine, installer-windows-engine, build-tauri, build-ios, docker, build-enroller]
    if: needs.check-trigger.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
          # Only the shipping artifacts — exclude the internal webui-dist
          # build artifact, whose raw frontend files (index.html, *.js, svgs)
          # would otherwise pollute the release assets.
          pattern: "{gpsmock-*,GpsMockCompanion-*,ios-enroller-*}"

      - name: Attach bootstrap installer scripts
        # Pinned copy of the install one-liners, reproducible per-release even
        # though the README/release body always points at the `main` raw URL
        # (which keeps installing whatever is latest at run time regardless).
        run: cp scripts/install.sh scripts/install.ps1 dist/

      - name: Publish release
        # Every job this depends on has already succeeded by the time this
        # runs, so the tag + release are only ever created here, at the very
        # end, with every asset already built. softprops/action-gh-release
        # creates the tag (pointing at this commit) if it doesn't exist yet.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.check-trigger.outputs.tag }}
          files: dist/**/*
          generate_release_notes: true
          body: |
            ## Installation en une commande (toujours la dernière version)

            ```bash
            # Linux / macOS
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
            ```
            ```powershell
            # Windows
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex
            ```

            Demande la variante (headless+web ou desktop) puis télécharge
            uniquement le binaire correspondant — toujours la release la plus
            récente, quelle que soit la version du script. `install.sh` /
            `install.ps1` sont aussi joints ci-dessous en copie figée de
            cette release, pour archive/usage hors-ligne.

            ## Quel fichier télécharger ?

            ### Application de bureau (interface + moteur intégré)
            | Plateforme | Fichier |
            |---|---|
            | Windows | `*_x64-setup.exe` (installeur) ou `*_x64_en-US.msi` |
            | macOS | `*_aarch64.dmg` |
            | Linux | `*_amd64.AppImage`, `*_amd64.deb` ou `*.x86_64.rpm` |

            Les deux pilotes iOS (go-ios et pymobiledevice) sont intégrés — aucune installation de Python requise. go-ios est le pilote par défaut.

            ### Moteur seul (serveur / headless / automatisation)
            | Cas | Fichier |
            |---|---|
            | **Windows, portable (recommandé)** | `gpsmock-engine-portable.exe` — un seul fichier, rien à décompresser ; go-ios + pymobiledevice intégrés (extraits au 1er lancement) |
            | Windows, installé | `gpsmock-engine-setup.exe` — installeur (menu Démarrer + désinstalleur), mêmes pilotes |
            | Windows, binaire nu | `gpsmock-engine-windows-amd64.exe` (sans pilote, pour configuration avancée) |
            | Linux / macOS | `gpsmock-engine-<os>-<arch>` |
            | Conteneur | `docker pull ghcr.io/${{ github.repository }}/gpsmock-engine:${{ needs.check-trigger.outputs.tag }}` |

            ### Outils d'enrôlement iOS (Optionnels)
            Utiles pour extraire et pousser les certificats locaux ("Lockdown") vers un serveur ou conteneur Docker distant.
            *   `ios-enroller.exe` : Interface graphique (Web local).
            *   `ios-enroller-cli.exe` : Outil ultra-léger en ligne de commande.

            ### Application compagnon iOS
            `GpsMockCompanion-unsigned.ipa` — non signé, à ré-signer à l'installation (AltStore, etc.).

