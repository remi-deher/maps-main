name: Security & Dependency Scan

on:
  workflow_dispatch:
  push:
    branches: [v3-rewrite, main]
    paths:
      - 'engine/**'
      - 'tauri-app/**'
      - 'docker/**'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'tauri-app/**'
      - 'docker/**'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: go vulnerability scan (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: engine
        run: govulncheck ./...

  npm-audit:
    name: npm audit (tauri-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Audit (high+ severity)
        working-directory: tauri-app
        run: npm audit --audit-level=high

  cargo-audit:
    name: cargo audit (tauri-app/src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: tauri-app/src-tauri
        run: cargo audit

  trivy-docker:
    name: container image scan (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: gpsmock-engine:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gpsmock-engine:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-engine-image
