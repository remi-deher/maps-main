name: iOS Companion Build CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build-ci.yml'
  pull_request:
    paths:
      - 'ios-app/**'
      - '.github/workflows/ios-build-ci.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned .ipa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project GpsMockCompanion.xcodeproj \
            -scheme GpsMockCompanion \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/GpsMockCompanion.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p dist
          # AltStore re-signs on install; this .ipa is intentionally unsigned.
          zip -r "dist/GpsMockCompanion-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: GpsMockCompanion-unsigned-ipa
          path: ios-app/dist/GpsMockCompanion-unsigned.ipa
          retention-days: 30
