version: 2

updates:
  # Go module used by the engine.
  - package-ecosystem: gomod
    directory: /engine
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns:
          - '*'

  # Tauri desktop app frontend (npm).
  - package-ecosystem: npm
    directory: /tauri-app
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns:
          - '*'

  # Tauri desktop app backend (Rust/Cargo).
  - package-ecosystem: cargo
    directory: /tauri-app/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-deps:
        patterns:
          - '*'

  # Docker base image used by the engine container.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  # Legacy Node/Electron + Expo implementation, kept as reference until the
  # v3 rewrite reaches parity — still worth patching known vulnerabilities.
  - package-ecosystem: npm
    directory: /legacy/client
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /legacy/server
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /legacy/ios-enroller
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns:
          - '*'

  # The workflows themselves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
