version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm dependencies for Tauri Frontend
  - package-ecosystem: "npm"
    directory: "/tauri-app"
    schedule:
      interval: "weekly"

  # Go dependencies for Engine
  - package-ecosystem: "gomod"
    directory: "/engine"
    schedule:
      interval: "weekly"

  # Cargo dependencies for Tauri Backend
  - package-ecosystem: "cargo"
    directory: "/tauri-app/src-tauri"
    schedule:
      interval: "weekly"
