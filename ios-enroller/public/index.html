<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Enroller - Setup Trust</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <svg viewBox="0 0 24 24">
                <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
            </svg>
        </div>
        <h1>iOS Enroller</h1>
        <div class="subtitle">Configuration du lien de confiance USB</div>
    </div>

    <div class="status-box">
        <div id="statusDot" class="pulse-dot"></div>
        <div class="status-text" id="statusMain">Recherche d'appareil...</div>
        <div class="status-subtext" id="statusSub">Veuillez brancher votre iPhone en USB</div>
    </div>

    <button id="btnPair" class="hidden">
        <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        Associer l'appareil (Pair)
    </button>

    <div id="transferSection" class="hidden">
        <div class="card-divider"></div>
        <div class="input-group">
            <label for="targetIp">Adresse du Serveur Moteur cible</label>
            <div class="input-wrapper">
                <input type="text" id="targetIp" placeholder="192.168.1.143" value="localhost">
            </div>
            <select id="discoveredServers" class="hidden" style="margin-top: 10px;"></select>
            <button id="btnScan" type="button" class="btn-secondary">
                <svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Scanner le réseau (mDNS)
            </button>
        </div>
        <button id="btnTransfer" class="btn-success">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
            Transférer les clés de pairage
        </button>
    </div>

    <div class="log-container">
        <div class="log-header">
            <span>Terminal de logs</span>
            <span style="font-size:0.75rem; font-family:'JetBrains Mono'" id="logCount">0 msg</span>
        </div>
        <div class="log-box" id="logBox"></div>
    </div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
